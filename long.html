<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Long Timer - Futuristic Timer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .long-timer-display {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        .world-clock-container {
            background: var(--secondary-bg);
            border: 2px solid var(--accent-color);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 0 50px var(--glow-color);
            position: relative;
            overflow: hidden;
            max-width: 800px;
            width: 100%;
        }

        .timer-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 30px;
            text-shadow: 0 0 20px var(--glow-color);
        }

        .target-date {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-family: 'Orbitron', monospace;
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .time-unit {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px 10px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .time-unit:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--glow-color);
            transform: translateY(-5px);
        }

        .time-value {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 5px;
            text-shadow: 0 0 15px var(--glow-color);
        }

        .time-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .globe-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 30px auto;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(0, 255, 255, 0.3), rgba(0, 255, 255, 0.1));
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 40px var(--glow-color);
            animation: globeRotate 20s linear infinite;
        }

        @keyframes globeRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .globe-inner {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.1), transparent 50%),
                radial-gradient(circle at 60% 60%, rgba(0, 255, 255, 0.2), transparent 30%);
            animation: globeInnerRotate 15s linear infinite reverse;
        }

        @keyframes globeInnerRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .orbit-ring {
            position: absolute;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            animation: orbitRotate 10s linear infinite;
        }

        .orbit-ring:nth-child(1) {
            width: 250px;
            height: 250px;
            top: -25px;
            left: -25px;
        }

        .orbit-ring:nth-child(2) {
            width: 300px;
            height: 300px;
            top: -50px;
            left: -50px;
            animation-duration: 15s;
            animation-direction: reverse;
        }

        @keyframes orbitRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .status-message {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: var(--secondary-accent);
            margin-top: 20px;
            text-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), var(--secondary-accent));
            border-radius: 2px;
            transition: width 1s ease;
            box-shadow: 0 0 10px var(--glow-color);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--secondary-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 20px;
            color: var(--text-primary);
            text-decoration: none;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-btn:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--glow-color);
            transform: translateY(-2px);
        }

        .finished-state {
            animation: finishPulse 1s ease-in-out infinite alternate;
        }

        @keyframes finishPulse {
            0% { 
                transform: scale(1);
                box-shadow: 0 0 50px var(--glow-color);
            }
            100% { 
                transform: scale(1.02);
                box-shadow: 0 0 100px var(--glow-color), 0 0 150px var(--secondary-accent);
            }
        }

        @media (max-width: 768px) {
            .world-clock-container {
                padding: 20px;
                margin: 10px;
            }

            .timer-title {
                font-size: 2rem;
            }

            .time-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .time-value {
                font-size: 2rem;
            }

            .globe-container {
                width: 150px;
                height: 150px;
            }

            .orbit-ring:nth-child(1) {
                width: 200px;
                height: 200px;
                top: -25px;
                left: -25px;
            }

            .orbit-ring:nth-child(2) {
                width: 250px;
                height: 250px;
                top: -50px;
                left: -50px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back</a>
    
    <div class="long-timer-display">
        <div class="world-clock-container" id="timer-container">
            <h1 class="timer-title">LONG TIMER</h1>
            <div class="target-date" id="target-date">Target: Loading...</div>
            
            <div class="time-grid">
                <div class="time-unit">
                    <div class="time-value" id="years-value">0</div>
                    <div class="time-label">Years</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="months-value">0</div>
                    <div class="time-label">Months</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="days-value">0</div>
                    <div class="time-label">Days</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="hours-value">0</div>
                    <div class="time-label">Hours</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="minutes-value">0</div>
                    <div class="time-label">Minutes</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="seconds-value">0</div>
                    <div class="time-label">Seconds</div>
                </div>
            </div>

            <div class="globe-container">
                <div class="orbit-ring"></div>
                <div class="orbit-ring"></div>
                <div class="globe-inner"></div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div class="status-message" id="status-message">Countdown in progress...</div>
        </div>
    </div>

    <div class="background-effects">
        <div class="grid-overlay"></div>
        <div class="floating-particles"></div>
    </div>

    <script>
        class LongTimer {
            constructor() {
                this.targetDate = null;
                this.startDate = new Date();
                this.intervalId = null;
                this.isFinished = false;
                this.init();
            }

            init() {
                this.loadTimerData();
                this.updateDisplay();
                this.startTimer();
            }

            loadTimerData() {
                const timerData = JSON.parse(localStorage.getItem('timerData'));
                if (timerData && timerData.type === 'long') {
                    this.targetDate = new Date(
                        timerData.year,
                        timerData.month - 1,
                        timerData.date,
                        timerData.hour,
                        timerData.minute,
                        timerData.second
                    );
                } else {
                    // Default to end of current year
                    const now = new Date();
                    this.targetDate = new Date(now.getFullYear(), 11, 31, 23, 59, 59);
                }

                // Display target date
                const options = {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                };
                document.getElementById('target-date').textContent = 
                    `Target: ${this.targetDate.toLocaleDateString('en-US', options)}`;
            }

            startTimer() {
                this.intervalId = setInterval(() => {
                    this.updateDisplay();
                }, 1000);
            }

            updateDisplay() {
                const now = new Date();
                const timeDiff = this.targetDate - now;

                if (timeDiff <= 0 && !this.isFinished) {
                    this.timerFinished();
                    return;
                }

                if (timeDiff > 0) {
                    const timeUnits = this.calculateTimeUnits(timeDiff);
                    this.updateTimeDisplay(timeUnits);
                    this.updateProgress(now);
                    this.updateStatus(timeUnits);
                }
            }

            calculateTimeUnits(timeDiff) {
                const years = Math.floor(timeDiff / (1000 * 60 * 60 * 24 * 365.25));
                const months = Math.floor((timeDiff % (1000 * 60 * 60 * 24 * 365.25)) / (1000 * 60 * 60 * 24 * 30.44));
                const days = Math.floor((timeDiff % (1000 * 60 * 60 * 24 * 30.44)) / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);

                return { years, months, days, hours, minutes, seconds };
            }

            updateTimeDisplay(timeUnits) {
                document.getElementById('years-value').textContent = timeUnits.years;
                document.getElementById('months-value').textContent = timeUnits.months;
                document.getElementById('days-value').textContent = timeUnits.days;
                document.getElementById('hours-value').textContent = timeUnits.hours.toString().padStart(2, '0');
                document.getElementById('minutes-value').textContent = timeUnits.minutes.toString().padStart(2, '0');
                document.getElementById('seconds-value').textContent = timeUnits.seconds.toString().padStart(2, '0');

                // Add color changes for urgency
                this.updateUrgencyColors(timeUnits);
            }

            updateUrgencyColors(timeUnits) {
                const timeValues = document.querySelectorAll('.time-value');
                
                if (timeUnits.years === 0 && timeUnits.months === 0 && timeUnits.days === 0) {
                    if (timeUnits.hours < 1) {
                        timeValues.forEach(val => val.style.color = '#ff0040');
                    } else if (timeUnits.hours < 24) {
                        timeValues.forEach(val => val.style.color = '#ff8000');
                    }
                } else {
                    timeValues.forEach(val => val.style.color = 'var(--text-primary)');
                }
            }

            updateProgress(now) {
                const totalDuration = this.targetDate - this.startDate;
                const elapsed = now - this.startDate;
                const progress = Math.max(0, Math.min(100, (elapsed / totalDuration) * 100));
                
                document.getElementById('progress-fill').style.width = `${progress}%`;
            }

            updateStatus(timeUnits) {
                let message = 'Countdown in progress...';
                
                if (timeUnits.years > 0) {
                    message = `${timeUnits.years} year${timeUnits.years !== 1 ? 's' : ''} to go`;
                } else if (timeUnits.months > 0) {
                    message = `${timeUnits.months} month${timeUnits.months !== 1 ? 's' : ''} remaining`;
                } else if (timeUnits.days > 7) {
                    message = `${timeUnits.days} days left`;
                } else if (timeUnits.days > 0) {
                    message = `Final ${timeUnits.days} day${timeUnits.days !== 1 ? 's' : ''}!`;
                } else if (timeUnits.hours > 0) {
                    message = `${timeUnits.hours} hour${timeUnits.hours !== 1 ? 's' : ''} remaining!`;
                } else if (timeUnits.minutes > 0) {
                    message = `${timeUnits.minutes} minute${timeUnits.minutes !== 1 ? 's' : ''} left!`;
                } else {
                    message = `${timeUnits.seconds} second${timeUnits.seconds !== 1 ? 's' : ''} remaining!`;
                }
                
                document.getElementById('status-message').textContent = message;
            }

            timerFinished() {
                this.isFinished = true;
                clearInterval(this.intervalId);
                
                // Set all values to zero
                document.getElementById('years-value').textContent = '0';
                document.getElementById('months-value').textContent = '0';
                document.getElementById('days-value').textContent = '0';
                document.getElementById('hours-value').textContent = '00';
                document.getElementById('minutes-value').textContent = '00';
                document.getElementById('seconds-value').textContent = '00';
                
                // Update status
                document.getElementById('status-message').textContent = 'TARGET REACHED!';
                document.getElementById('progress-fill').style.width = '100%';
                
                // Add finished animation
                document.getElementById('timer-container').classList.add('finished-state');
                
                // Play notification
                this.playNotificationSound();
                this.showNotification('Long Timer Finished!', 'Your target date has been reached.');
            }

            playNotificationSound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    // Create a more elaborate notification sound
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => {
                            const oscillator = audioContext.createOscillator();
                            const gainNode = audioContext.createGain();
                            
                            oscillator.connect(gainNode);
                            gainNode.connect(audioContext.destination);
                            
                            oscillator.frequency.setValueAtTime(600 + (i * 200), audioContext.currentTime);
                            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                            
                            oscillator.start(audioContext.currentTime);
                            oscillator.stop(audioContext.currentTime + 0.5);
                        }, i * 200);
                    }
                } catch (e) {
                    console.log('Audio notification not supported');
                }
            }

            showNotification(title, message) {
                if ('Notification' in window) {
                    if (Notification.permission === 'granted') {
                        new Notification(title, {
                            body: message,
                            icon: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHZpZXdCb3g9IjAgMCA2NCA2NCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iMzIiIGN5PSIzMiIgcj0iMzAiIHN0cm9rZT0iIzAwZmZmZiIgc3Ryb2tlLXdpZHRoPSI0Ii8+Cjwvc3ZnPgo='
                        });
                    } else if (Notification.permission !== 'denied') {
                        Notification.requestPermission().then(permission => {
                            if (permission === 'granted') {
                                new Notification(title, { body: message });
                            }
                        });
                    }
                }
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new LongTimer();
        });
    </script>
</body>
</html>
